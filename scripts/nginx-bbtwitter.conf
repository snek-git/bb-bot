# BBTwitter (bb/bbtwitter.py) on mc-server: /etc/nginx/sites-enabled/bbtwitter.
# Installed once, then `certbot --nginx -d bbtwitter.snek.page` adds HTTPS and the http->https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name bbtwitter.snek.page;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}
