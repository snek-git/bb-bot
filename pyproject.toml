[project]
name = "bb-bot"
version = "0.1.0"
description = "BB, the link-fixing kouhai for /fgog/"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "yt-dlp>=2025.1.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real fixer sites over the network (run with -m live)"]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
